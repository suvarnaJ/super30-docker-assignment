
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Super30 Student Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            padding: 30px;
            color: #253047;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            color: #243b64;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000010;
        }

        input {
            padding: 11px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 27%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            margin: 4px;
        }

        .delete {
            background: #dc2626;
        }

        .edit {
            background: #059669;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #edf2fa;
        }

        #message {
            margin: 12px 0;
            font-weight: bold;
        }

        @media(max-width: 650px) {
            input {
                width: 100%;
            }

            .table-wrapper {
                overflow-x: auto;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🎓 Student Management System</h1>

    <p>Super30 Docker Assignment - Task 23</p>

    <div class="card">

        <h2 id="formTitle">Add New Student</h2>

        <input
            type="text"
            id="name"
            placeholder="Student Name"
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
        >

        <input
            type="text"
            id="course"
            placeholder="Course"
        >

        <br>

        <button onclick="saveStudent()">
            Save Student
        </button>

        <button onclick="resetForm()">
            Clear
        </button>

        <p id="message"></p>

    </div>


    <div class="card">

        <h2>Student Records</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by name, email or course"
            oninput="loadStudents()"
        >

        <button onclick="loadStudents()">
            Refresh
        </button>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

const API = "http://localhost:8023";

let editingId = null;


async function loadStudents() {

    try {

        const search = document.getElementById("search").value;

        const response = await fetch(
            `${API}/students?search=${encodeURIComponent(search)}`
        );

        if (!response.ok) {
            throw new Error("Unable to load students");
        }

        const students = await response.json();

        const table = document.getElementById("studentTable");

        table.innerHTML = "";

        students.forEach(student => {

            const row = document.createElement("tr");

            [
                student.id,
                student.name,
                student.email,
                student.course
            ].forEach(value => {

                const cell = document.createElement("td");

                cell.textContent = value;

                row.appendChild(cell);

            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");

            editButton.textContent = "Edit";

            editButton.className = "edit";

            editButton.onclick = () => editStudent(student);

            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.className = "delete";

            deleteButton.onclick = () => deleteStudent(student.id);

            actions.appendChild(editButton);

            actions.appendChild(deleteButton);

            row.appendChild(actions);

            table.appendChild(row);

        });

    } catch (error) {

        showMessage(error.message, true);

    }

}


async function saveStudent() {

    const student = {

        name: document.getElementById("name").value.trim(),

        email: document.getElementById("email").value.trim(),

        course: document.getElementById("course").value.trim()

    };

    if (!student.name || !student.email || !student.course) {

        showMessage("Please enter all student details", true);

        return;

    }

    const url = editingId
        ? `${API}/students/${editingId}`
        : `${API}/students`;

    const method = editingId ? "PUT" : "POST";

    try {

        const response = await fetch(url, {

            method: method,

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(student)

        });

        const result = await response.json();

        if (!response.ok) {

            throw new Error(
                result.detail || "Operation failed"
            );

        }

        showMessage(
            editingId
                ? "Student updated successfully"
                : "Student added successfully"
        );

        resetForm();

        loadStudents();

    } catch (error) {

        showMessage(error.message, true);

    }

}


function editStudent(student) {

    editingId = student.id;

    document.getElementById("name").value = student.name;

    document.getElementById("email").value = student.email;

    document.getElementById("course").value = student.course;

    document.getElementById("formTitle").textContent = "Update Student";

    window.scrollTo(0, 0);

}


async function deleteStudent(id) {

    if (!confirm("Are you sure you want to delete this student?")) {

        return;

    }

    try {

        const response = await fetch(
            `${API}/students/${id}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok) {

            throw new Error(
                result.detail || "Delete failed"
            );

        }

        showMessage("Student deleted successfully");

        loadStudents();

    } catch (error) {

        showMessage(error.message, true);

    }

}


function resetForm() {

    editingId = null;

    document.getElementById("name").value = "";

    document.getElementById("email").value = "";

    document.getElementById("course").value = "";

    document.getElementById("formTitle").textContent = "Add New Student";

}


function showMessage(message, isError = false) {

    const element = document.getElementById("message");

    element.textContent = message;

    element.style.color = isError ? "#dc2626" : "#059669";

}


loadStudents();

</script>

</body>

</html>
